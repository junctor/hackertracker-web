name: Validate

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "validate-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Check
        run: vp check --no-fmt
      - name: Test
        run: vp test
      - name: Build
        run: vp run build
